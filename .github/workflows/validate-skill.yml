name: Validate Skill

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate SKILL.md frontmatter
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run frontmatter validation
        run: node .github/scripts/validate-skill.js

      - name: Show status badge info
        if: success()
        run: |
          echo "✅ 校验通过"
          echo "Badge URL: https://github.com/${{ github.repository }}/actions/workflows/validate-skill.yml/badge.svg"
